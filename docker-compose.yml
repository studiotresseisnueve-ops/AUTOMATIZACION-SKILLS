services:
  agent:
    build: .
    container_name: agentes_autonomos
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # ── INPUT ──────────────────────────────────────────────────────────
      - ./data/empresas:/app/data/empresas

      # ── SKILLS ─────────────────────────────────────────────────────────
      - ./src/prompts:/app/src/prompts:ro

      # ── OUTPUT (tunnel to PC) ───────────────────────────────────────────

      - ./outputs:/app/outputs

      # ── LOGS ───────────────────────────────────────────────────────────
      - ./logs:/app/logs

    stdin_open: false
    tty: false
